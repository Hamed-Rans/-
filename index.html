<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویژار | دستیار هوشمند جزوه‌نویسی</title>
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="style.css">
    <!-- آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- فونت‌های وب -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Vazirmatn:wght@300;400;700&family=Lalezar&display=swap" rel="stylesheet">
</head>
<body>

    <!-- هدر شیشه‌ای اصلی -->
    <header class="glass-header">
        <div class="brand">
            <i class="fa-solid fa-feather logo-icon"></i>
            <h1 class="brand-name">ویژار</h1>
        </div>
        <div class="header-actions">
            <button id="backToDashBtn" class="btn-icon hidden" title="داشبورد"><i class="fa-solid fa-house"></i></button>
            <button id="importBtn" class="btn-ghost hidden" title="وارد کردن"><i class="fa-solid fa-file-import"></i> بارگذاری</button>
            <button id="exportBtn" class="btn-ghost hidden" title="خروجی"><i class="fa-solid fa-file-export"></i> خروجی</button>
            <div class="divider-v"></div>
            <button id="settingsBtn" class="btn-icon" title="تنظیمات"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <!-- ۱. صفحه انتخاب نقش (شیک و متحرک) -->
    <section id="role-view" class="view-section active">
        <div class="role-container">
            <div class="role-header">
                <h2>به <span>ویژار</span> خوش آمدید</h2>
                <p>برای شخصی‌سازی محیط، نقش خود را انتخاب کنید</p>
            </div>
            <div class="role-cards">
                <div class="role-card glass-panel" data-role="student">
                    <div class="role-icon"><i class="fa-solid fa-user-graduate"></i></div>
                    <h3>دانشجو / دانش‌آموز</h3>
                    <p>یادداشت‌برداری سریع، مرور و خلاصه‌سازی</p>
                </div>
                <div class="role-card glass-panel" data-role="teacher">
                    <div class="role-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <h3>استاد / معلم</h3>
                    <p>ابزارهای تدریس، وایت‌برد و دسته‌بندی پیشرفته</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ۲. صفحه داشبورد (فولدر راست، جزوه چپ) -->
    <section id="dashboard-view" class="view-section hidden">
        <div class="dashboard-layout">
            <!-- فولدرها (سمت راست) -->
            <aside class="sidebar-right glass-panel">
                <div class="sidebar-header">
                    <h3><i class="fa-solid fa-folder-tree"></i> دسته‌بندی‌ها</h3>
                    <button id="addFolderBtn" class="btn-icon-small" title="افزودن دسته‌بندی"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul id="folderList" class="folder-list">
                    <!-- فولدرها توسط جاوا اسکریپت رندر می‌شوند -->
                </ul>
            </aside>
            
            <!-- جزوه‌ها (سمت چپ) -->
            <main class="documents-area">
                <div class="dash-actions">
                    <h2>جزوه‌های من <span id="userRoleBadge" class="persian-badge"></span></h2>
                    <button id="createNewDocBtn" class="btn-primary"><i class="fa-solid fa-plus"></i> جزوه جدید</button>
                </div>
                
                <div id="emptyState" class="empty-state hidden glass-panel">
                    <i class="fa-regular fa-folder-open empty-icon"></i>
                    <p>هنوز جزوه‌ای در این بخش ثبت نکرده‌اید.</p>
                </div>

                <div class="documents-grid" id="documentsGrid">
                    <!-- کارت‌های جزوه اینجا لود می‌شوند -->
                </div>
            </main>
        </div>
    </section>

    <!-- ۳. صفحه ویرایشگر (سه ستونه) -->
    <section id="editor-view" class="view-section hidden">
        <div class="workspace-layout">
            
            <!-- ستون راست: چکنویس تایپی -->
            <aside class="side-panel right-panel glass-panel">
                <div class="panel-header"><i class="fa-solid fa-keyboard"></i> چکنویس تایپی</div>
                <textarea id="textScratchpad" class="custom-textarea scratchpad-text" placeholder="متن‌های موقت، پیش‌نویس‌ها یا ایده‌های خود را اینجا تایپ کنید..."></textarea>
            </aside>

            <!-- ستون مرکز: ادیتور اصلی و نوار ابزار شناور -->
            <main class="editor-main glass-panel">
                <input type="text" id="documentTitle" class="doc-title-input" placeholder="عنوان جزوه...">
                <div id="editor" contenteditable="true" class="editor-box" placeholder="شروع به نوشتن کنید..."></div>
                
                <!-- نوار ابزار شناور شیشه‌ای -->
                <div
