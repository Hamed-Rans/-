<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویژار | دستیار هوشمند جزوه‌نویسی</title>
    <!-- استایل‌ها -->
    <link rel="stylesheet" href="style.css">
    <!-- آیکون‌های مدرن (FontAwesome 6) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- فونت کلاسیک برای لوگو -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- هدر شناور و کپسولی -->
    <header class="floating-header">
        <!-- بلوک راست -->
        <div class="brand-block glass-element">
            <i class="fa-solid fa-feather logo-icon"></i>
            <h1 class="brand-name">ویژار</h1>
        </div>

        <!-- بلوک چپ (دکمه‌ها جدا شدند) -->
        <div class="actions-block">
            <button id="importBtn" class="header-btn text-btn glass-element hidden"><i class="fa-solid fa-cloud-arrow-up"></i> افزودن مدیا</button>
            <button id="exportBtn" class="header-btn text-btn glass-element hidden"><i class="fa-solid fa-download"></i> دریافت جزوه</button>
            <!-- دکمه خانه کنار تنظیمات -->
            <button id="backToDashBtn" class="header-btn icon-btn glass-element hidden" title="خانه"><i class="fa-solid fa-house"></i></button>
            <button id="settingsBtn" class="header-btn icon-btn squircle-btn glass-element" title="تنظیمات"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
    </header>

    <!-- ۱. صفحه انتخاب نقش -->
    <section id="role-view" class="view-section hidden">
        <div class="role-container">
            <div class="role-header">
                <h2>به <span>ویژار</span> خوش آمدید</h2>
                <p>جهت تنظیم محیط، نقش خود را انتخاب کنید</p>
            </div>
            <div class="role-cards">
                <div class="role-card glass-panel" data-role="student">
                    <div class="role-icon"><i class="fa-solid fa-user-graduate"></i></div>
                    <h3>دانشجو / دانش‌آموز</h3>
                </div>
                <div class="role-card glass-panel" data-role="teacher">
                    <div class="role-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <h3>استاد / معلم</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- ۲. صفحه داشبورد -->
    <section id="dashboard-view" class="view-section hidden">
        <div class="dashboard-layout">
            <!-- ستون راست: دسته‌بندی‌ها (پایین آورده شد) -->
            <aside class="sidebar-right glass-panel">
                <div class="sidebar-header">
                    <h3><i class="fa-solid fa-layer-group"></i> دسته‌بندی‌ها</h3>
                    <button id="addFolderBtn" class="btn-icon-small"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul id="folderList" class="folder-list">
                    <!-- با جاوا اسکریپت پر می‌شود -->
                </ul>
            </aside>
            
            <!-- ستون چپ: جزوه‌ها -->
            <main class="documents-area">
                <div class="dash-actions">
                    <h2>جزوه‌های من <span id="userRoleBadge" class="badge"></span></h2>
                    <!-- دکمه جمع‌وجور و گرد -->
                    <button id="createNewDocBtn" class="btn-primary-compact"><i class="fa-solid fa-plus"></i> ایجاد جزوه</button>
                </div>

                <div id="emptyState" class="empty-state hidden glass-panel">
                    <i class="fa-regular fa-folder-open empty-icon"></i>
                    <p>هیچ جزوه‌ای در این دسته‌بندی یافت نشد.</p>
                </div>

                <div class="documents-grid" id="documentsGrid">
                    <!-- با جاوا اسکریپت پر می‌شود -->
                </div>
            </main>
        </div>
    </section>

    <!-- ۳. صفحه ویرایشگر (سه ستونه) -->
    <section id="editor-view" class="view-section hidden">
        <div class="workspace-layout">
            
            <!-- ستون راست: چرک‌نویس -->
            <aside class="side-panel right-panel glass-panel">
                <div class="panel-header"><i class="fa-solid fa-keyboard"></i> چرک‌نویس</div>
                <textarea id="textScratchpad" class="scratchpad-text" placeholder="ایده‌ها و متن‌های موقت..."></textarea>
            </aside>

            <!-- ادیتور اصلی -->
            <main class="editor-main glass-panel">
                <!-- نوار ابزار بالا (شناور در خود ادیتور) -->
                <div class="top-sticky-toolbar glass-element">
                    <!-- منوی فونت فیکس شده -->
                    <div class="custom-dropdown" id="fontDropdown">
                        <div class="dropdown-selected">یکان‌بخ (مدرن) <i class="fa-solid fa-chevron-down"></i></div>
                        <div class="dropdown-list">
                            <div class="dropdown-item" data-value="YekanBakh">یکان‌بخ (مدرن)</div>
                            <div class="dropdown-item" data-value="Estedad">استعداد (فانتزی)</div>
                            <div class="dropdown-item" data-value="Dana">دانا (خوانا)</div>
                            <div class="dropdown-item" data-value="Liana">لیانا (تیتر)</div>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <button class="tool-btn" id="increaseFontBtn" title="بزرگ‌نمایی"><i class="fa-solid fa-a"></i><i class="fa-solid fa-plus" style="font-size:0.6em;"></i></button>
                    <button class="tool-btn" id="decreaseFontBtn" title="کوچک‌نمایی"><i class="fa-solid fa-a"></i><i class="fa-solid fa-minus" style="font-size:0.6em;"></i></button>
                </div>

                <!-- عنوان و محیط تایپ -->
                <div class="title-container">
                    <input type="text" id="documentTitle" class="doc-title-input" placeholder="عنوان جزوه...">
                </div>
                <div id="editor" contenteditable="true" class="editor-box" placeholder="تایپ کنید..."></div>
                
                <!-- نوار ابزار پایین (ابزارهای سریع) -->
                <div class="floating-bottom-toolbar glass-element">
                    <button class="tool-btn toggle-tool" data-command="bold"><i class="fa-solid fa-bold"></i></button>
                    <button class="tool-btn toggle-tool" data-command="italic"><i class="fa-solid fa-italic"></i></button>
                    <button class="tool-btn toggle-tool" data-command="underline"><i class="fa-solid fa-underline"></i></button>
                    <div class="divider"></div>
                    <button class="tool-btn" data-command="justifyRight"><i class="fa-solid fa-align-right"></i></button>
                    <button class="tool-btn" data-command="justifyCenter"><i class="fa-solid fa-align-center"></i></button>
                    <button class="tool-btn" data-command="justifyLeft"><i class="fa-solid fa-align-left"></i></button>
                    <div class="divider"></div>
                    <input type="color" id="nativeColorPicker" value="#00A693" class="color-picker-simple" title="رنگ متن">
                    <div class="divider"></div>
                    <button id="saveDocBtn" class="tool-btn action-btn primary-glow" title="ذخیره جزوه"><i class="fa-solid fa-floppy-disk"></i></button>
                </div>
            </main>

            <!-- ستون چپ: نکات و بوم -->
            <aside class="side-panel left-panel">
                <div class="notes-panel glass-panel">
                    <div class="panel-header"><i class="fa-solid fa-thumbtack"></i> نکات پین‌شده</div>
                    <div id="pinnedNotesArea" class="notes-container"></div>
                </div>
                
                <div class="visual-scratchpad glass-panel">
                    <div class="panel-header">
                        <i class="fa-solid fa-palette"></i> بوم
                        <button id="exportBoardToDocBtn" class="btn-text-small"><i class="fa-solid fa-turn-up"></i> افزودن به متن</button>
                    </div>
                    <div class="scratchpad-tools">
                        <button class="board-tool active" data-tool="pencil" title="قلم"><i class="fa-solid fa-pencil"></i></button>
                        <button class="board-tool" data-tool="highlighter" title="هایلایتر"><i class="fa-solid fa-highlighter"></i></button>
                        <div class="shape-tools">
                            <button class="board-tool" data-tool="line" title="خط"><i class="fa-solid fa-minus"></i></button>
                            <button class="board-tool" data-tool="rect" title="مربع"><i class="fa-regular fa-square"></i></button>
                            <button class="board-tool" data-tool="circle" title="دایره"><i class="fa-regular fa-circle"></i></button>
                        </div>
                        <button class="board-tool" data-tool="eraser" title="پاک‌کن"><i class="fa-solid fa-eraser"></i></button>
                        <input type="color" id="boardColor" value="#00A693" class="color-picker-simple">
                        <button id="clearBoardBtn" class="board-tool"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="canvas-container">
                        <!-- نشانه‌گر ماوس -->
                        <div id="cursorPointer" class="canvas-cursor hidden"></div>
                        <canvas id="scratchpadCanvas" width="280" height="200"></canvas>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <!-- منوی راست‌کلیک پیشرفته -->
    <div id="customContextMenu" class="context-menu glass-panel hidden">
        <ul>
            <li id="menuCopy"><i class="fa-regular fa-copy"></i> کپی</li>
            <li id="menuCut
